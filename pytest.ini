[pytest]
testpaths = .
addopts = -p no:cacheprovider -ra --strict-markers
markers =
    slow: end-to-end tests that start real processes (engine, front-end, fake server)
    windows: Windows-only behaviour
    posix: macOS / Linux-only behaviour
    training_code: runs the train/export code on a toy model (opt-in: pytest --run-training-code)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
