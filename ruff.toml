line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",                      # assert is how tests check things
    "S105", "S106",              # fake keys and tokens are test data on purpose
    "S311",                      # seeded random for reproducible test data
    "S603", "S607",              # tests start the CLI and the fake server as subprocesses
    "RUF001", "RUF002", "RUF003",
    "RUF012",                    # read-only class-level fixtures
]

[lint.isort]
known-first-party = ["mcp_shield", "mcp_shield_train", "helpers", "conftest"]
